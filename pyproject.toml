# ==============================================================================
# Build system — src/mldd layout (PEP 517/621)
# ==============================================================================
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mldd"
version = "0.1.0"
description = "Production ML pipeline for multi-target bioactivity prediction in neurodegenerative diseases (AChE, GSK-3B, MAO-B, LRRK2)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Carla Di Monno", email = "carladimonno@gmail.com" }]
requires-python = ">=3.12"
keywords = [
    "drug-discovery",
    "chemoinformatics",
    "ch embl",
    "rdkit",
    "machine-learning",
    "bioactivity",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]

# Minimum floors are intentionally conservative: pip always resolves the newest
# available version, floors only guarantee installability.
dependencies = [
    # --- Core scientific computing ---
    "numpy>=2.0.2",
    "pandas>=2.2.2",
    # --- Chemoinformatics & molecular descriptors ---
    "rdkit>=2026.3.1",
    "chembl-webresource-client>=0.10.9",
    "padelpy>=0.1.9",
    # --- Machine learning, optimization & explainability (XAI) ---
    "scikit-learn>=1.6.1",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "lazypredict>=0.3.0",
    "optuna>=4.0.0",
    "shap>=0.46.0",
    "joblib>=1.4.0",
    # --- Configuration & validation ---
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "pydantic>=2.7.0",
    "pandera>=0.20.0",
    # --- MLOps, orchestration & CLI ---
    "mlflow>=2.14.0",
    "typer>=0.12.0",
    "tenacity>=8.2.0",
    # --- Visualization & reporting ---
    "matplotlib>=3.8.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.0",
    "pre-commit>=4.0",
]

[project.scripts]
mldd = "mldd.cli:app"

[project.urls]
Repository = "https://github.com/carladdm/ML-Drug-Discovery-Neuro"

[tool.hatch.build.targets.wheel]
packages = ["src/mldd"]

# ==============================================================================
# Ruff — lint & format
# ==============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # comprehensions
    "PTH", # prefer pathlib
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length is enforced by the formatter where possible
]

[tool.ruff.lint.isort]
known-first-party = ["mldd"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ==============================================================================
# Mypy — strict type checking
# ==============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "typings" # Shadow rdkit's broken vendored stubs (typings/rdkit)
warn_unreachable = true
show_error_codes = true
pretty = true

# Third-party libraries without PEP 561 type information.
[[tool.mypy.overrides]]
module = [
    "rdkit",
    "rdkit.*",
    "chembl_webresource_client",
    "chembl_webresource_client.*",
    "padelpy",
    "padelpy.*",
    "joblib",
    "joblib.*",
    "sklearn",
    "sklearn.*",
    "shap",
    "shap.*",
    "mlflow",
    "mlflow.*",
    "lazypredict",
    "lazypredict.*",
    "seaborn",
    "seaborn.*",
    "optuna",
    "optuna.*",
    "hydra",
    "hydra.*",
    "omegaconf",
    "omegaconf.*",
    "tenacity",
    "tenacity.*",
    "pandera",
    "pandera.*",
    "typer",
    "typer.*",
]
ignore_missing_imports = true

# rdkit's vendored stubs fail to parse (upstream codegen bug, all recent
# releases); ``typings/rdkit`` shadows them via mypy_path — see that module.
[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*"]
ignore_missing_imports = true

# ==============================================================================
# Pytest
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests (parity checks, full tuning runs)",
    "padel: requires a local Java runtime for PaDEL descriptor generation",
    "integration: end-to-end pipeline tests",
]
filterwarnings = ["error::FutureWarning:mldd.*"]
